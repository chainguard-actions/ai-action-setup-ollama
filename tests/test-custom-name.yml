name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama >= 0.14.0 tar.zst extraction)
        run: |
          if ! command -v zstd > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          fi
          zstd --version
      - id: action
        uses: .
        with:
          name: my-ollama
      - name: Assert custom-named binary is on PATH
        run: |
          echo "Checking my-ollama is available..."
          if ! command -v my-ollama > /dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama found at $(command -v my-ollama)"
      - name: Assert custom-named binary runs
        run: |
          VERSION_OUTPUT=$(my-ollama --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: my-ollama --version produced no output"
            exit 1
          fi
          echo "PASS: my-ollama is executable and produced output"
