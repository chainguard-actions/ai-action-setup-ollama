name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for .tar.zst extraction)
        run: |
          if command -v sudo > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          else
            apt-get update -qq && apt-get install -y zstd
          fi
      - id: action
        uses: .
        with:
          name: my-ollama
        continue-on-error: true
      - name: Assert custom-named binary is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking my-ollama is on PATH..."
            if ! command -v my-ollama > /dev/null 2>&1; then
              echo "FAIL: my-ollama not found on PATH"
              exit 1
            fi
            echo "PASS: my-ollama found at $(command -v my-ollama)"
            VERSION_OUTPUT=$(my-ollama --version 2>&1 || true)
            echo "version output: $VERSION_OUTPUT"
            if echo "$VERSION_OUTPUT" | grep -q "0.32.15"; then
              echo "PASS: version matches default 0.32.15"
            else
              echo "FAIL: expected version 0.32.15 in output: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment limitation in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
