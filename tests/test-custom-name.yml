name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.13.5
          name: myollama
      - name: Assert binary renamed to myollama
        run: |
          if ! command -v myollama >/dev/null 2>&1; then
            echo "FAIL: myollama not found on PATH"
            exit 1
          fi
          echo "path: $(command -v myollama)"
          OUT="$(myollama --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "0.13.5"; then
            echo "FAIL: expected version 0.13.5"
            exit 1
          fi
          echo "PASS"
