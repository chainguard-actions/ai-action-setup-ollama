name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for .tar.zst extraction)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - id: setup
        uses: .
        with:
          name: my-ollama
      - name: Assert custom-named binary is on PATH
        run: |
          echo "which my-ollama: $(which my-ollama || echo 'NOT FOUND')"
          if ! command -v my-ollama > /dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama found at $(which my-ollama)"
      - name: Assert custom binary runs
        run: |
          VERSION_OUTPUT="$(my-ollama --version 2>&1 || true)"
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: my-ollama --version returned empty output"
            exit 1
          fi
          echo "PASS: my-ollama version output: $VERSION_OUTPUT"
