name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.12.0
          name: my-ollama
      - name: Assert renamed binary is on PATH
        run: |
          if ! command -v my-ollama >/dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "found: $(command -v my-ollama)"
          OUT="$(my-ollama --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "0.12.0"; then
            echo "FAIL: expected version 0.12.0"
            exit 1
          fi
          echo "PASS"
