name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          mkdir -p /tmp/tool-cache
          echo "node version: $(node --version 2>/dev/null || echo 'not found')"
          echo "uname: $(uname -a)"
          echo "PATH: $PATH"
      - id: action
        uses: .
        with:
          name: my-ollama
          version: 0.13.5
      - name: Assert custom-named binary is installed
        run: |
          echo "PATH after action: $PATH"
          echo "Checking my-ollama is on PATH..."
          if ! command -v my-ollama > /dev/null 2>&1; then
            echo "FAIL: my-ollama command not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama found at $(command -v my-ollama)"
      - name: Assert custom-named binary is functional
        run: |
          VERSION="$(my-ollama --version 2>&1 || true)"
          echo "my-ollama version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: my-ollama produced no output"
            exit 1
          fi
          echo "PASS: my-ollama is functional"
      - name: Assert custom-named binary version matches
        run: |
          VERSION="$(my-ollama --version 2>&1 || true)"
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -q "0.13.5"; then
            echo "PASS: version 0.13.5 found in my-ollama output"
          else
            echo "FAIL: expected version 0.13.5 in my-ollama output: $VERSION"
            exit 1
          fi
