name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama >= 0.14.0 on Linux)
        run: |
          apt-get update -qq && apt-get install -y -qq zstd || \
          (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
      - id: action
        uses: .
        with:
          name: my-ollama
      - name: Assert custom-named binary is on PATH
        run: |
          echo "Checking my-ollama is available..."
          if ! command -v my-ollama >/dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama found at $(command -v my-ollama)"
      - name: Assert custom-named binary runs
        run: |
          OUTPUT="$(my-ollama --version 2>&1 || true)"
          echo "my-ollama output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: my-ollama produced no output"
            exit 1
          fi
          echo "PASS: my-ollama produced output: $OUTPUT"
