name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: my-ollama
        continue-on-error: true
      - name: Assert custom-named binary is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking my-ollama is on PATH..."
            if ! command -v my-ollama > /dev/null 2>&1; then
              echo "FAIL: my-ollama not found on PATH after successful action"
              exit 1
            fi
            echo "PASS: my-ollama found at $(command -v my-ollama)"
            VERSION_OUTPUT=$(my-ollama --version 2>&1 || true)
            echo "version output: $VERSION_OUTPUT"
            if [ -z "$VERSION_OUTPUT" ]; then
              echo "FAIL: no version output from my-ollama"
              exit 1
            fi
            echo "PASS: my-ollama --version returned: $VERSION_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/download issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
