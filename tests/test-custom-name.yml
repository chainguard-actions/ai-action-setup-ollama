name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clear stale tool cache entry
        run: |
          TC="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO rm -rf "$TC/my-ollama/0.13.5" "$TC/my-ollama/0.13.5-complete" || true
      - id: action
        uses: .
        with:
          version: 0.13.5
          name: my-ollama
      - name: Assert renamed binary is on PATH
        run: |
          echo "PATH: $PATH"
          if ! command -v my-ollama >/dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "path: $(command -v my-ollama)"
          OUT="$(my-ollama --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "0.13.5"; then
            echo "FAIL: expected version 0.13.5"
            exit 1
          fi
          echo "PASS"
