name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
            $SUDO apt-get update -y && $SUDO apt-get install -y zstd
          fi
      - id: action
        uses: .
        with:
          name: my-ollama
      - name: Assert renamed binary is on PATH
        run: |
          P="$(command -v my-ollama || true)"
          echo "path: $P"
          if [ -z "$P" ]; then
            echo "FAIL: my-ollama not on PATH"
            exit 1
          fi
          OUT="$(my-ollama --version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q "0.40.14"; then
            echo "FAIL: expected version 0.40.14"
            exit 1
          fi
          echo "PASS"
