name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install zstd (required for tar.zst extraction)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: myollama

      - name: Assert custom-named binary installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking 'myollama' is on PATH..."
            if ! command -v myollama > /dev/null 2>&1; then
              echo "FAIL: action succeeded but 'myollama' not found on PATH"
              exit 1
            fi
            echo "PASS: myollama found at $(command -v myollama)"
            BINARY_PATH=$(command -v myollama)
            if [ ! -x "$BINARY_PATH" ]; then
              echo "FAIL: myollama binary is not executable"
              exit 1
            fi
            echo "PASS: myollama binary is executable"
            VERSION_OUTPUT=$(myollama --version 2>&1 || true)
            echo "version output: $VERSION_OUTPUT"
            if [ -z "$VERSION_OUTPUT" ]; then
              echo "FAIL: myollama --version produced no output"
              exit 1
            fi
            echo "PASS: myollama is executable and produced output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment limitation in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
