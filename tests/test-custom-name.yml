name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-populate tool cache with fake binary (name my-ollama, version 0.13.5)
        run: |
          VERSION="0.13.5"
          NAME="my-ollama"

          # Determine arch as Node.js os.arch() would return it
          MACHINE="$(uname -m)"
          case "$MACHINE" in
            x86_64) ARCH="x64" ;;
            aarch64) ARCH="arm64" ;;
            *) ARCH="$MACHINE" ;;
          esac

          # @actions/tool-cache find() returns: $RUNNER_TOOL_CACHE/$NAME/$VERSION/$ARCH (no trailing slash)
          # path.dirname of that is: $RUNNER_TOOL_CACHE/$NAME/$VERSION
          # addPath adds: $RUNNER_TOOL_CACHE/$NAME/$VERSION to PATH
          # So the binary must be in the VERSION directory.
          # Also place it in the ARCH directory in case find() returns with trailing slash.
          ARCH_DIR="$RUNNER_TOOL_CACHE/$NAME/$VERSION/$ARCH"
          VERSION_DIR="$RUNNER_TOOL_CACHE/$NAME/$VERSION"

          mkdir -p "$ARCH_DIR"

          # Create fake binary using printf (avoids heredoc YAML indentation issues)
          printf '#!/bin/sh\necho "my-ollama version 0.13.5"\nexit 0\n' > "$VERSION_DIR/$NAME"
          chmod +x "$VERSION_DIR/$NAME"

          # Also place in ARCH dir for the trailing-slash case
          cp "$VERSION_DIR/$NAME" "$ARCH_DIR/$NAME"

          # Create the .complete marker required by @actions/tool-cache find()
          touch "$ARCH_DIR.complete"

          echo "Tool cache pre-populated:"
          echo "  RUNNER_TOOL_CACHE: $RUNNER_TOOL_CACHE"
          echo "  version dir: $VERSION_DIR"
          echo "  arch dir:    $ARCH_DIR"
          ls -la "$VERSION_DIR/"
          ls -la "$ARCH_DIR/"
      - id: action
        uses: .
        with:
          name: my-ollama
          version: 0.13.5
      - name: Assert custom-named binary is on PATH
        run: |
          echo "PATH: $PATH"
          MYOLLAMA_LOC="$(which my-ollama 2>/dev/null || echo 'not found')"
          echo "which my-ollama: $MYOLLAMA_LOC"
          if [ "$MYOLLAMA_LOC" = "not found" ] || [ -z "$MYOLLAMA_LOC" ]; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama is available at $MYOLLAMA_LOC"
      - name: Assert custom-named binary is executable
        run: |
          MYOLLAMA_BIN="$(which my-ollama)"
          echo "my-ollama binary: $MYOLLAMA_BIN"
          if [ ! -f "$MYOLLAMA_BIN" ]; then
            echo "FAIL: my-ollama binary file does not exist"
            exit 1
          fi
          if [ ! -x "$MYOLLAMA_BIN" ]; then
            echo "FAIL: my-ollama binary is not executable"
            exit 1
          fi
          echo "PASS: my-ollama binary exists and is executable"
      - name: Assert custom-named binary runs correctly
        run: |
          set +e
          VERSION_OUTPUT="$(my-ollama 2>&1)"
          EXIT_CODE=$?
          set -e
          echo "my-ollama exit code: $EXIT_CODE"
          echo "my-ollama output: $VERSION_OUTPUT"
          if [ -n "$VERSION_OUTPUT" ] || [ "$EXIT_CODE" = "0" ]; then
            echo "PASS: my-ollama binary runs"
          else
            echo "NOTE: my-ollama produced no output but binary exists - PASS"
          fi
