name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama tar.zst extraction)
        run: |
          apt-get update -qq && apt-get install -y -qq zstd || true
      - id: setup
        uses: .
        with:
          name: "my-ollama"
        continue-on-error: true
      - name: Assert custom-named binary installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking my-ollama binary..."
            if ! command -v my-ollama >/dev/null 2>&1; then
              echo "FAIL: my-ollama binary not found in PATH after successful action"
              exit 1
            fi
            echo "PASS: my-ollama found at $(command -v my-ollama)"
            VERSION="$(my-ollama --version 2>&1 || true)"
            echo "version output: $VERSION"
            if [ -z "$VERSION" ]; then
              echo "FAIL: my-ollama --version returned empty output"
              exit 1
            fi
            echo "PASS: my-ollama binary is functional"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (node24 runtime or download not available in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
