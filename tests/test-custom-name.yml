name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: my-ollama
      - name: Assert custom-named binary is on PATH
        run: |
          echo "which my-ollama: $(which my-ollama || echo 'not found')"
          if ! command -v my-ollama > /dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama is available"
      - name: Assert default name is not present (or custom name is distinct)
        run: |
          CUSTOM_PATH="$(which my-ollama 2>/dev/null || echo '')"
          echo "custom binary path: $CUSTOM_PATH"
          if [ -z "$CUSTOM_PATH" ]; then
            echo "FAIL: my-ollama binary not found"
            exit 1
          fi
          echo "PASS: custom-named binary exists at $CUSTOM_PATH"
