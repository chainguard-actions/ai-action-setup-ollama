name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama >= 0.14.0 tar.zst extraction)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - id: action
        uses: .
        with:
          name: my-ollama
      - name: Assert custom-named binary is installed
        run: |
          echo "Checking my-ollama is on PATH..."
          if ! command -v my-ollama >/dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama found at $(command -v my-ollama)"
      - name: Assert custom-named binary runs correctly
        run: |
          VERSION_OUTPUT=$(my-ollama --version 2>&1 || true)
          echo "actual version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qiE "ollama|version|0\."; then
            echo "PASS: my-ollama binary works"
          else
            echo "FAIL: unexpected output from my-ollama: $VERSION_OUTPUT"
            exit 1
          fi
