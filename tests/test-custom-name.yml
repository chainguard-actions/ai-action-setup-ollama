name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          name: "my-ollama"
      - name: Assert custom-named binary is installed
        run: |
          echo "Checking my-ollama is on PATH..."
          if ! command -v my-ollama >/dev/null 2>&1; then
            echo "FAIL: my-ollama command not found on PATH"
            exit 1
          fi
          echo "PASS: my-ollama found at $(command -v my-ollama)"
      - name: Assert default ollama name is not present (or custom name works)
        run: |
          VERSION="$(my-ollama --version 2>&1 || true)"
          echo "my-ollama version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: my-ollama --version returned empty output"
            exit 1
          fi
          echo "PASS: my-ollama is functional"
