name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available (default version ships as .tar.zst)
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
            $SUDO apt-get update -y && $SUDO apt-get install -y zstd
          fi
          zstd --version
      - id: action
        uses: .
        with:
          name: my-ollama
      - name: Assert renamed binary is on PATH
        run: |
          if ! command -v my-ollama >/dev/null 2>&1; then
            echo "FAIL: my-ollama not found on PATH"
            exit 1
          fi
          echo "my-ollama at: $(command -v my-ollama)"
          OUT="$(my-ollama --version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q "0.40.8"; then
            echo "FAIL: expected version 0.40.8"
            exit 1
          fi
          echo "PASS"
