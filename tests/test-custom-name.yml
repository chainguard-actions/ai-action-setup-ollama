name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available (default version ships .tar.zst)
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            SUDO=""
            if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
            $SUDO apt-get update -y && $SUDO apt-get install -y zstd
          fi
          zstd --version
      - id: action
        uses: .
        with:
          name: ollama-custom
      - name: Assert binary installed under the custom name
        run: |
          if ! command -v ollama-custom >/dev/null 2>&1; then
            echo "FAIL: ollama-custom not found on PATH"
            exit 1
          fi
          BIN="$(command -v ollama-custom)"
          echo "binary path: $BIN"
          if [ "$(basename "$BIN")" != "ollama-custom" ]; then
            echo "FAIL: unexpected binary name"
            exit 1
          fi
          if [ -e "$(dirname "$BIN")/ollama" ]; then
            echo "FAIL: original 'ollama' binary still present next to renamed one"
            exit 1
          fi
          OUT="$(ollama-custom --version 2>&1 || true)"
          echo "version output: $OUT"
          # The upstream 0.40.18 binary self-reports a slightly different patch
          # version, so only assert the 0.40.x line.
          if ! echo "$OUT" | grep -qE "version is 0\.40\.[0-9]+"; then
            echo "FAIL: expected an ollama 0.40.x version string"
            exit 1
          fi
          echo "PASS"
