name: Test custom name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-populate tool cache with fake ollama-cli binary
        run: |
          VERSION="0.30.10"
          NAME="ollama-cli"
          ARCH="x64"
          CACHE_ROOT="$RUNNER_TOOL_CACHE"
          ARCH_DIR="$CACHE_ROOT/$NAME/$VERSION/$ARCH"
          VERSION_DIR="$CACHE_ROOT/$NAME/$VERSION"

          mkdir -p "$ARCH_DIR"
          touch "$ARCH_DIR.complete"

          # Write fake binary using printf (no heredoc to avoid YAML issues)
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "ollama version 0.30.10"; elif [ "$1" = "serve" ]; then exit 0; fi\n' > "$VERSION_DIR/$NAME"
          chmod +x "$VERSION_DIR/$NAME"

          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "ollama version 0.30.10"; elif [ "$1" = "serve" ]; then exit 0; fi\n' > "$ARCH_DIR/$NAME"
          chmod +x "$ARCH_DIR/$NAME"

          echo "Tool cache populated:"
          ls -la "$VERSION_DIR"
          ls -la "$ARCH_DIR"

      - id: action
        uses: .
        with:
          name: ollama-cli

      - name: Assert custom-named binary is installed
        run: |
          echo "PATH=$PATH"
          echo "Checking ollama-cli is on PATH..."
          which ollama-cli || { echo "FAIL: ollama-cli not found on PATH"; exit 1; }
          echo "PASS: ollama-cli found at $(which ollama-cli)"

      - name: Assert custom-named binary runs
        run: |
          VERSION_OUTPUT=$(ollama-cli --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: ollama-cli produced no output"
            exit 1
          fi
          echo "PASS: ollama-cli is functional"
