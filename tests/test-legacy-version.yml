name: Test legacy version (.tgz archive)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.13.5
      - name: Assert ollama version
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          OUT="$(ollama --version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q "0.13.5"; then
            echo "FAIL: expected version 0.13.5"
            exit 1
          fi
          echo "PASS"
