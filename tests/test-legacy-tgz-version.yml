name: Test older version (tgz archive, pre-zst)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clear any cached copy so the tgz download path is exercised
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO rm -rf "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/ollama-legacy" \
                       "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/ollama/0.13.5" || true
      - id: action
        uses: .
        with:
          version: 0.13.5
          name: ollama-legacy
      - name: Assert ollama version
        run: |
          if ! command -v ollama-legacy >/dev/null 2>&1; then
            echo "FAIL: ollama-legacy not found on PATH"
            exit 1
          fi
          OUT="$(ollama-legacy --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE "0\.13\.[0-9]+"; then
            echo "FAIL: expected a 0.13.x version"
            exit 1
          fi
          echo "PASS"
