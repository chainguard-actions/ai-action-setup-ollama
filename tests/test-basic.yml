name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available and clear stale tool cache
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if ! command -v zstd >/dev/null 2>&1; then
            $SUDO apt-get update -y >/dev/null && $SUDO apt-get install -y zstd >/dev/null
          fi
          zstd --version
          TC="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          # Clear every cached ollama version so the action does a fresh install
          $SUDO rm -rf "$TC/ollama" || true
      - id: action
        uses: .
      - name: Assert ollama is on PATH and reports a valid version
        run: |
          echo "PATH: $PATH"
          if ! command -v ollama >/dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "path: $(command -v ollama)"
          OUT="$(ollama --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE 'version is [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected 'ollama version is X.Y.Z' in output"
            exit 1
          fi
          echo "PASS"
