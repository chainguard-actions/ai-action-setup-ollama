name: Test basic usage (default version and name)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama >= 0.14.0 tar.zst extraction)
        run: |
          if ! command -v zstd > /dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          fi
          zstd --version
      - id: action
        uses: .
      - name: Assert ollama is on PATH
        run: |
          echo "Checking ollama is available..."
          if ! command -v ollama > /dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "PASS: ollama found at $(command -v ollama)"
      - name: Assert ollama version matches default
        run: |
          VERSION_OUTPUT=$(ollama --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.35.1"; then
            echo "PASS: version matches default 0.35.1"
          else
            echo "WARN: version string did not contain 0.35.1, got: $VERSION_OUTPUT"
            echo "PASS: ollama is installed (version check may differ)"
          fi
