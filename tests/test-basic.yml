name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama >= 0.14.0 tar.zst extraction)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - id: action
        uses: .
      - name: Assert ollama is installed
        run: |
          echo "Checking ollama is on PATH..."
          if ! command -v ollama >/dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "PASS: ollama found at $(command -v ollama)"
      - name: Assert ollama version matches default
        run: |
          VERSION_OUTPUT=$(ollama --version 2>&1 || true)
          echo "actual version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qE "0\.32\.1"; then
            echo "PASS: version 0.32.1 found"
          else
            echo "FAIL: expected version 0.32.1 in output: $VERSION_OUTPUT"
            exit 1
          fi
