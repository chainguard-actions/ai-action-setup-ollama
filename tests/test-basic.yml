name: Test basic usage (default version and name)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install zstd (required for tar.zst extraction)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - id: action
        uses: .
        continue-on-error: true
        # Uses default inputs: version=0.40.0, name=ollama

      - name: Assert ollama installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking ollama is on PATH..."
            if ! command -v ollama > /dev/null 2>&1; then
              echo "FAIL: action succeeded but 'ollama' not found on PATH"
              exit 1
            fi
            echo "PASS: ollama found at $(command -v ollama)"
            OLLAMA_PATH=$(command -v ollama)
            if [ ! -x "$OLLAMA_PATH" ]; then
              echo "FAIL: ollama binary is not executable"
              exit 1
            fi
            echo "PASS: ollama binary is executable"
            VERSION_OUTPUT=$(ollama --version 2>&1 || true)
            echo "version output: $VERSION_OUTPUT"
            if echo "$VERSION_OUTPUT" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "PASS: version number found in output"
            else
              echo "FAIL: no version number found in output: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment limitation in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
