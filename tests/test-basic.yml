name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama tar.zst extraction)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert ollama installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking ollama is on PATH..."
            if ! command -v ollama >/dev/null 2>&1; then
              echo "FAIL: ollama not found on PATH after successful action"
              exit 1
            fi
            VERSION="$(ollama --version 2>&1 || true)"
            echo "ollama version output: $VERSION"
            if echo "$VERSION" | grep -q "0.32.13"; then
              echo "PASS: version 0.32.13 found"
            else
              echo "FAIL: expected version 0.32.13 in output: $VERSION"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/download issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
