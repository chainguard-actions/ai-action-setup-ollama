name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for ollama tar.zst extraction)
        run: |
          apt-get update -qq && apt-get install -y -qq zstd || true
      - id: setup
        uses: .
        continue-on-error: true
      - name: Assert ollama installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking ollama binary..."
            if ! command -v ollama >/dev/null 2>&1; then
              echo "FAIL: ollama binary not found in PATH after successful action"
              exit 1
            fi
            echo "PASS: ollama found at $(command -v ollama)"
            VERSION="$(ollama --version 2>&1 || true)"
            echo "version output: $VERSION"
            if echo "$VERSION" | grep -q "0.40.3"; then
              echo "PASS: version matches default 0.40.3"
            else
              echo "FAIL: expected version 0.40.3 in output: $VERSION"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (node24 runtime or download not available in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
