name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-populate tool cache with fake ollama binary
        run: |
          VERSION="0.30.10"
          NAME="ollama"
          ARCH="x64"
          CACHE_ROOT="$RUNNER_TOOL_CACHE"
          ARCH_DIR="$CACHE_ROOT/$NAME/$VERSION/$ARCH"
          VERSION_DIR="$CACHE_ROOT/$NAME/$VERSION"

          mkdir -p "$ARCH_DIR"
          touch "$ARCH_DIR.complete"

          # Write fake binary using printf (no heredoc to avoid YAML issues)
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "ollama version 0.30.10"; elif [ "$1" = "serve" ]; then exit 0; fi\n' > "$VERSION_DIR/$NAME"
          chmod +x "$VERSION_DIR/$NAME"

          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then echo "ollama version 0.30.10"; elif [ "$1" = "serve" ]; then exit 0; fi\n' > "$ARCH_DIR/$NAME"
          chmod +x "$ARCH_DIR/$NAME"

          echo "Tool cache populated:"
          ls -la "$VERSION_DIR"
          ls -la "$ARCH_DIR"

      - id: action
        uses: .

      - name: Assert ollama is installed
        run: |
          echo "PATH=$PATH"
          echo "Checking ollama is on PATH..."
          which ollama || { echo "FAIL: ollama not found on PATH"; exit 1; }
          echo "PASS: ollama found at $(which ollama)"

      - name: Assert ollama version matches default
        run: |
          VERSION_OUTPUT=$(ollama --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.30.10"; then
            echo "PASS: version matches default 0.30.10"
          else
            echo "FAIL: expected version 0.30.10 in output: $VERSION_OUTPUT"
            exit 1
          fi
