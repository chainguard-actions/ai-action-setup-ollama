name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available (needed for .tar.zst extraction)
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y zstd
          fi
          zstd --version
      - id: action
        uses: .
      - name: Assert ollama is on PATH
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "found: $(command -v ollama)"
          echo "PASS"
      - name: Assert ollama reports the default version
        run: |
          OUT="$(ollama --version 2>&1 || true)"
          echo "output: $OUT"
          if ! echo "$OUT" | grep -q "0.40.17"; then
            echo "FAIL: expected version 0.40.17 in output"
            exit 1
          fi
          echo "PASS"
