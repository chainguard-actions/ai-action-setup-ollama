name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert ollama is installed
        run: |
          echo "Checking ollama is on PATH..."
          if ! command -v ollama > /dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "PASS: ollama found at $(command -v ollama)"
      - name: Assert ollama binary is executable
        run: |
          OLLAMA_PATH=$(command -v ollama)
          echo "ollama path: $OLLAMA_PATH"
          if [ ! -x "$OLLAMA_PATH" ]; then
            echo "FAIL: ollama binary is not executable"
            exit 1
          fi
          echo "PASS: ollama binary is executable"
      - name: Assert ollama version output contains default version
        run: |
          VERSION_OUTPUT=$(ollama --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qF "0.32.7"; then
            echo "PASS: version matches default 0.32.7"
          else
            echo "FAIL: expected version 0.32.7 in output: $VERSION_OUTPUT"
            exit 1
          fi
