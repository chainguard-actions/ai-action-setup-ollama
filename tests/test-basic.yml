name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available (default version ships .tar.zst)
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            SUDO=""
            if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
            $SUDO apt-get update -y && $SUDO apt-get install -y zstd
          fi
          zstd --version
      - id: action
        uses: .
      - name: Assert ollama is on PATH and reports a version
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "ollama path: $(command -v ollama)"
          OUT="$(ollama --version 2>&1 || true)"
          echo "version output: $OUT"
          # Note: the upstream 0.40.18 release binary self-reports a slightly
          # different patch version, so only assert the 0.40.x line.
          if ! echo "$OUT" | grep -qE "version is 0\.40\.[0-9]+"; then
            echo "FAIL: expected an ollama 0.40.x version string"
            exit 1
          fi
          echo "PASS"
      - name: Assert ollama server is running
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version; then
              echo
              echo "PASS: server responded"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: ollama server did not respond on port 11434"
          exit 1
