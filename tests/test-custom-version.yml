name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.3.0
        continue-on-error: true
      - name: Assert ollama installed or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking ollama is on PATH..."
            if ! command -v ollama >/dev/null 2>&1; then
              echo "FAIL: ollama not found on PATH after successful action"
              exit 1
            fi
            VERSION="$(ollama --version 2>&1 || true)"
            echo "ollama version output: $VERSION"
            echo "PASS: ollama found at $(command -v ollama)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
