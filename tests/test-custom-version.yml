name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: "0.40.5"

      - name: Assert ollama is on PATH
        run: |
          echo "Checking ollama is available on PATH..."
          if ! command -v ollama > /dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "PASS: ollama found at $(command -v ollama)"

      - name: Assert ollama version matches requested version
        run: |
          echo "Checking ollama version..."
          VERSION=$(ollama --version 2>&1 || true)
          echo "version output: $VERSION"
          if echo "$VERSION" | grep -q "0.40.5"; then
            echo "PASS: version matches 0.40.5"
          else
            echo "FAIL: expected version 0.40.5, got: $VERSION"
            exit 1
          fi
