name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.34.0
      - name: Assert ollama is on PATH
        run: |
          echo "which ollama: $(which ollama || echo 'not found')"
          if ! command -v ollama > /dev/null 2>&1; then
            echo "FAIL: ollama not found on PATH"
            exit 1
          fi
          echo "PASS: ollama is available"
      - name: Assert ollama version matches requested version
        run: |
          VERSION="$(ollama --version 2>&1 || true)"
          echo "ollama version output: $VERSION"
          if echo "$VERSION" | grep -q "0.34.0"; then
            echo "PASS: version 0.34.0 found"
          else
            echo "FAIL: expected version 0.34.0 but got: $VERSION"
            exit 1
          fi
