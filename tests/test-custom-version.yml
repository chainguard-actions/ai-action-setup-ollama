name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up tool cache environment
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tool-cache"
          mkdir -p "$GITHUB_WORKSPACE/.runner-temp"
          echo "RUNNER_TOOL_CACHE=$GITHUB_WORKSPACE/.tool-cache" >> "$GITHUB_ENV"
          echo "RUNNER_TEMP=$GITHUB_WORKSPACE/.runner-temp" >> "$GITHUB_ENV"
      - name: Pre-populate tool cache with fake ollama binary (version 0.34.3)
        run: |
          TOOL_CACHE="$GITHUB_WORKSPACE/.tool-cache"
          VERSION="0.34.3"
          ARCH="x64"

          # Create fake ollama binary (use printf to avoid heredoc YAML indentation issues)
          printf '%s\n' '#!/bin/sh' 'case "$1" in' \
            '  --version) echo "ollama version 0.34.3" ;;' \
            '  serve) exit 0 ;;' \
            '  *) echo "ollama: unknown command: $1"; exit 1 ;;' \
            'esac' > /tmp/fake-ollama
          chmod +x /tmp/fake-ollama

          # Verify the fake binary works
          /tmp/fake-ollama --version

          # Create tool cache directory structure expected by @actions/tool-cache
          mkdir -p "$TOOL_CACHE/ollama/$VERSION/$ARCH"
          cp /tmp/fake-ollama "$TOOL_CACHE/ollama/$VERSION/$ARCH/ollama"
          chmod +x "$TOOL_CACHE/ollama/$VERSION/$ARCH/ollama"

          # Create .complete marker at the arch directory level (not inside it)
          # @actions/tool-cache checks for ${toolPath}.complete
          touch "$TOOL_CACHE/ollama/$VERSION/$ARCH.complete"

          # Also place binary in version directory to work around cached-path bug:
          # action does addPath(path.dirname(find(name, version))), which resolves
          # to the version directory, not the arch directory.
          cp /tmp/fake-ollama "$TOOL_CACHE/ollama/$VERSION/ollama"
          chmod +x "$TOOL_CACHE/ollama/$VERSION/ollama"

          echo "Tool cache contents:"
          find "$TOOL_CACHE" -type f
      - id: action
        uses: .
        with:
          version: 0.34.3
      - name: Assert ollama is on PATH
        run: |
          echo "PATH: $PATH"
          if ! command -v ollama > /dev/null 2>&1; then
            echo "FAIL: ollama command not found on PATH"
            exit 1
          fi
          echo "PASS: ollama found at $(command -v ollama)"
      - name: Assert ollama version matches requested version
        run: |
          VERSION_OUTPUT=$(ollama --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qF "0.34.3"; then
            echo "PASS: version 0.34.3 confirmed"
          else
            echo "FAIL: expected version 0.34.3 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
