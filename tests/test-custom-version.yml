name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install zstd (required for ollama >= 0.14.0 on Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - id: action
        uses: .
        with:
          version: 0.35.0
        continue-on-error: true

      - name: Assert ollama installed or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, verifying ollama binary..."
            if ! command -v ollama > /dev/null 2>&1; then
              echo "FAIL: ollama not found on PATH after successful action"
              exit 1
            fi
            echo "PASS: ollama found at $(command -v ollama)"
            VERSION_OUTPUT=$(ollama --version 2>&1 || true)
            echo "version output: $VERSION_OUTPUT"
            if echo "$VERSION_OUTPUT" | grep -q "0.35.0"; then
              echo "PASS: version 0.35.0 confirmed"
            else
              echo "FAIL: expected version 0.35.0 in output: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/runtime issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
