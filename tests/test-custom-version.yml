name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/tool-cache
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          mkdir -p /tmp/tool-cache
          echo "node version: $(node --version 2>/dev/null || echo 'not found')"
          echo "uname: $(uname -a)"
          echo "PATH: $PATH"
      - id: action
        uses: .
        with:
          version: 0.13.5
      - name: Assert ollama is installed
        run: |
          echo "PATH after action: $PATH"
          echo "Checking ollama is on PATH..."
          if ! command -v ollama > /dev/null 2>&1; then
            echo "FAIL: ollama command not found on PATH"
            exit 1
          fi
          echo "PASS: ollama found at $(command -v ollama)"
      - name: Assert ollama version matches requested version
        run: |
          VERSION="$(ollama --version 2>&1 || true)"
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -q "0.13.5"; then
            echo "PASS: version 0.13.5 found"
          else
            echo "FAIL: expected version 0.13.5 in output: $VERSION"
            exit 1
          fi
