name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for .tar.zst extraction)
        run: |
          apt-get install -y zstd 2>/dev/null || sudo apt-get install -y zstd 2>/dev/null || true
          which zstd && echo "zstd available" || echo "zstd not found, continuing anyway"
      - id: action
        uses: .
        with:
          version: 0.5.0
        continue-on-error: true
      - name: Assert ollama installed or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking ollama on PATH..."
            if ! command -v ollama >/dev/null 2>&1; then
              echo "FAIL: ollama not found on PATH after successful action"
              exit 1
            fi
            echo "PASS: ollama found at $(command -v ollama)"
            VERSION="$(ollama --version 2>&1 || true)"
            echo "ollama version output: $VERSION"
            if echo "$VERSION" | grep -q "0.5.0"; then
              echo "PASS: version 0.5.0 found"
            else
              echo "FAIL: expected version 0.5.0 in output: $VERSION"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (download/extraction issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
